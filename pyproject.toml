# PersonaLive-Blackwell: dependency source of truth.
#
# Install from requirements.txt, never from this list:
#     pip install --require-hashes -r requirements.txt
# The lock pins every package, direct or not, to one version with its SHA-256
# hashes. After editing the dependencies below, regenerate it: tools/lock.sh
#
# Lower bounds are the first releases free of every advisory OSV listed on
# 2026-11-08 (see SECURITY.md).

[project]
name = "personalive-blackwell"
version = "0.2.1"
description = "PersonaLive live portrait animation, patched for NVIDIA Blackwell (GB10) and mixed GPUs"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    # Model and inference
    "torch>=2.13.0",
    "torchvision",
    "diffusers>=0.38.0",
    "transformers>=5.5.0",
    "huggingface-hub",
    "safetensors",
    "einops",
    "numpy",
    "pillow>=13.0.0",
    "opencv-python-headless",
    "omegaconf",
    "tqdm",
    "av",
    # TensorRT path (launcher.py, torch2trt.py, src/modeling/)
    "tensorrt-cu13>=10.14,<11",
    "polygraphy",
    "onnx>=1.22.0",
    "onnx-graphsurgeon",
    "pycuda",
    # Web server (inference_online.py)
    "fastapi",
    "starlette>=1.3.1",
    "uvicorn",
    "websockets",
    "python-multipart>=0.0.30",
    "pydantic",
]

[tool.uv]
package = false
index-url = "https://pypi.org/simple"
# Linux (x86_64 RTX hosts, aarch64 DGX Spark GB10) and Windows x86_64.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# Transitive floors: never resolve below a release that fixed an advisory.
constraint-dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "filelock>=3.20.3",
    "fsspec>=2026.6.0",
    "idna>=3.15",
    "mako>=1.4.2",
    "protobuf>=6.33.5",
    "requests>=2.33.0",
    "setuptools>=84.1.0",
    "urllib3>=2.8.0",
]

# tensorrt-cu13 and tensorrt-cu13-libs ship on PyPI only as NVIDIA "wheel-stub"
# placeholders: at install time they fetch the real wheel from
# https://pypi.nvidia.com/ and check it against that index's SHA-256. Their
# metadata is declared here so locking never runs the stub (SECURITY.md).
[[tool.uv.dependency-metadata]]
name = "tensorrt-cu13"
version = "10.16.1.11"
requires-dist = ["tensorrt-cu13-libs==10.16.1.11", "tensorrt-cu13-bindings==10.16.1.11"]

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu13-libs"
version = "10.16.1.11"
requires-dist = []
